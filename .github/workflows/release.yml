name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

env:
  TOKEN_TRACKER_SUPABASE_URL: ${{ vars.TOKEN_TRACKER_SUPABASE_URL }}
  TOKEN_TRACKER_SUPABASE_ANON_KEY: ${{ secrets.TOKEN_TRACKER_SUPABASE_ANON_KEY }}

jobs:
  validate-cloud-config:
    name: Validate cloud configuration
    runs-on: ubuntu-latest
    steps:
      - name: Require packaged-app cloud configuration
        run: node -e "if (!process.env.TOKEN_TRACKER_SUPABASE_URL || !process.env.TOKEN_TRACKER_SUPABASE_ANON_KEY) process.exit(1)"

  build-windows:
    name: Build Windows
    needs: validate-cloud-config
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          npm run lint
          npm run test:backend

      - name: Build Windows installer
        run: npm run release:installer

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            release/Agent-Token-Tracker-Setup-*.exe
            release/Agent-Token-Tracker-Setup-*.exe.blockmap
            release/latest.yml

  build-macos:
    name: Build macOS
    needs: validate-cloud-config
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          npm run lint
          npm run test:backend

      - name: Build macOS dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run release:mac

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/latest-mac.yml

  build-npm:
    name: Build npm package
    needs: validate-cloud-config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Update npm
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          npm run lint
          npm run test:backend

      - name: Pack npm tarball
        run: npm run package:npm

      - name: Upload npm artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: agent-token-tracker-*.tgz

      - name: Publish npm package
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --access public

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-macos
      - build-npm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*
